<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="sbuMaroonGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="70%" stop-color="#800000" />
      <stop offset="100%" stop-color="#550000" />
    </radialGradient>
    <linearGradient id="sbuGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <radialGradient id="sbuNavyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142850" />
      <stop offset="85%" stop-color="#07162C" />
      <stop offset="100%" stop-color="#040B16" />
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Text Paths for Top and Bottom Arcs -->
    <path id="topArc" d="M 24,100 A 76,76 0 1,1 176,100" fill="none" />
    <path id="bottomArc" d="M 176,100 A 76,76 0 0,1 24,100" fill="none" />
    <path id="innerBottomArc" d="M 160,100 A 60,60 0 0,1 40,100" fill="none" />
  </defs>

  <!-- Outer Ring Beaded Rim -->
  <circle cx="100" cy="100" r="98" fill="url(#sbuGoldGrad)" stroke="#550000" stroke-width="1.5" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="#550000" stroke-width="0.8" stroke-dasharray="2,2.5" />

  <!-- Main Circular Band in Imperial SBU Maroon -->
  <circle cx="100" cy="100" r="93" fill="url(#sbuMaroonGrad)" stroke="url(#sbuGoldGrad)" stroke-width="2.5" />

  <!-- Circular Text: SARALA BIRLA UNIVERSITY -->
  <text font-family="'Times New Roman', 'Merriweather', 'Georgia', serif" font-size="12.5" font-weight="900" fill="url(#sbuGoldGrad)" letter-spacing="2.2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      SARALA BIRLA UNIVERSITY
    </textPath>
  </text>

  <!-- Bottom Text: RANCHI with Gold Stars -->
  <text font-family="'Times New Roman', 'Merriweather', 'Georgia', serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="3.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ★  RANCHI  ★
    </textPath>
  </text>

  <!-- Inner Concentric Border -->
  <circle cx="100" cy="100" r="68" fill="url(#sbuNavyGrad)" stroke="url(#sbuGoldGrad)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="65" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="1.5,2" opacity="0.6" />

  <!-- Central Heraldic Academic Shield -->
  <path d="M 64,68 L 136,68 C 136,105 118,128 100,138 C 82,128 64,105 64,68 Z"
        fill="#07162C" stroke="url(#sbuGoldGrad)" stroke-width="2" />

  <!-- Radiant Sunburst inside Shield -->
  <g opacity="0.25">
    <line x1="100" y1="88" x2="72" y2="76" stroke="#FBBF24" stroke-width="1" />
    <line x1="100" y1="88" x2="82" y2="70" stroke="#FBBF24" stroke-width="1" />
    <line x1="100" y1="88" x2="100" y2="68" stroke="#FBBF24" stroke-width="1" />
    <line x1="100" y1="88" x2="118" y2="70" stroke="#FBBF24" stroke-width="1" />
    <line x1="100" y1="88" x2="128" y2="76" stroke="#FBBF24" stroke-width="1" />
  </g>

  <!-- Sacred Gyan Jyoti / Eternal Enlightenment Torch -->
  <!-- Torch Base / Handle -->
  <path d="M 96,96 L 104,96 L 102,112 L 98,112 Z" fill="url(#sbuGoldGrad)" stroke="#7A5210" stroke-width="0.5" />
  <path d="M 94,93 L 106,93 L 104,96 L 96,96 Z" fill="#D4AF37" />
  <!-- Flaming Torch Glow -->
  <circle cx="100" cy="85" r="9" fill="#F59E0B" opacity="0.3" filter="blur(1px)" />
  <!-- Flame Silhouette -->
  <path d="M 100,74 C 104,80 107,84 105,90 C 103,94 97,94 95,90 C 93,85 97,80 100,74 Z"
        fill="url(#flameGrad)" />
  <path d="M 100,78 C 102,82 104,85 103,89 C 101,92 98,92 97,89 C 96,86 98,82 100,78 Z"
        fill="#FEF08A" />

  <!-- Open Book of Wisdom -->
  <g transform="translate(0, 15)">
    <!-- Book Pages Backdrop -->
    <path d="M 75,100 C 86,95 97,98 100,102 C 103,98 114,95 125,100 L 125,112 C 114,107 103,110 100,114 C 97,110 86,107 75,112 Z"
          fill="#FFFFFF" stroke="#D4AF37" stroke-width="1" />
    <!-- Book Center Seam -->
    <line x1="100" y1="102" x2="100" y2="114" stroke="#800000" stroke-width="1.2" />
    <!-- Page text lines hints -->
    <line x1="80" y1="103" x2="94" y2="101" stroke="#94A3B8" stroke-width="0.8" />
    <line x1="80" y1="106" x2="94" y2="104" stroke="#94A3B8" stroke-width="0.8" />
    <line x1="80" y1="109" x2="92" y2="107" stroke="#94A3B8" stroke-width="0.8" />
    <line x1="106" y1="101" x2="120" y2="103" stroke="#94A3B8" stroke-width="0.8" />
    <line x1="106" y1="104" x2="120" y2="106" stroke="#94A3B8" stroke-width="0.8" />
    <line x1="108" y1="107" x2="120" y2="109" stroke="#94A3B8" stroke-width="0.8" />
  </g>

  <!-- Established Year Badge -->
  <rect x="84" y="141" width="32" height="9" rx="4.5" fill="#800000" stroke="url(#sbuGoldGrad)" stroke-width="0.8" />
  <text x="100" y="148" text-anchor="middle" font-family="'Times New Roman', serif" font-size="5.5" font-weight="bold" fill="#FFF" letter-spacing="1">
    ESTD. 2017
  </text>

  <!-- Motto Ribbon at Base of Shield -->
  <g transform="translate(0, 16)">
    <!-- Ribbon tails -->
    <polygon points="52,148 64,142 64,152" fill="#800000" stroke="#AA771C" stroke-width="0.6" />
    <polygon points="148,148 136,142 136,152" fill="#800000" stroke="#AA771C" stroke-width="0.6" />
    <!-- Main Ribbon Body -->
    <path d="M 60,143 Q 100,150 140,143 L 138,153 Q 100,160 62,153 Z" fill="url(#sbuGoldGrad)" stroke="#550000" stroke-width="0.8" />
    <!-- Sanskrit Motto Text -->
    <text x="100" y="150" text-anchor="middle" font-family="'Times New Roman', serif" font-size="5.8" font-weight="900" fill="#550000" letter-spacing="0.8">
      ज्ञानं परमं ध्येयम्
    </text>
  </g>

  <!-- Laurel / Wheat Ears Garland on Flanks -->
  <g fill="url(#sbuGoldGrad)" stroke="#8A6412" stroke-width="0.3">
    <!-- Left Laurel -->
    <path d="M 52,100 C 51,90 54,80 60,72 C 58,78 57,86 58,94 Z" />
    <circle cx="53" cy="85" r="1.6" />
    <circle cx="56" cy="95" r="1.6" />
    <circle cx="59" cy="105" r="1.6" />
    <circle cx="63" cy="115" r="1.6" />
    <!-- Right Laurel -->
    <path d="M 148,100 C 149,90 146,80 140,72 C 142,78 143,86 142,94 Z" />
    <circle cx="147" cy="85" r="1.6" />
    <circle cx="144" cy="95" r="1.6" />
    <circle cx="141" cy="105" r="1.6" />
    <circle cx="137" cy="115" r="1.6" />
  </g>
</svg>
